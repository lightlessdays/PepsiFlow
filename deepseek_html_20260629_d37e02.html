<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel → JSON · monochrome</title>
  <!-- SheetJS for parsing -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b0b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      color: #eaeaea;
    }

    .app {
      max-width: 880px;
      width: 100%;
      background: #141414;
      border-radius: 32px;
      padding: 2.2rem 2.2rem 1.8rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px #2a2a2a;
      transition: 0.2s;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 0.9rem;
    }

    .header-left h1 {
      font-size: 1.8rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-left h1 span {
      background: #2a2a2a;
      padding: 0.1rem 0.8rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 400;
      color: #aaa;
      letter-spacing: 0.3px;
    }

    .header-left .sub {
      color: #8f8f8f;
      font-size: 0.9rem;
      margin-top: 0.1rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-left .sub code {
      background: #1e1e1e;
      padding: 0.1rem 0.8rem;
      border-radius: 30px;
      font-size: 0.75rem;
      color: #c0c0c0;
      border: 1px solid #2e2e2e;
    }

    .badge {
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 40px;
      padding: 0.3rem 1.2rem;
      font-size: 0.7rem;
      color: #b0b0b0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.2px;
    }

    .upload-area {
      background: #1a1a1a;
      border: 1px solid #2c2c2c;
      border-radius: 60px;
      padding: 0.4rem 0.4rem 0.4rem 1.8rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.8rem;
      transition: 0.15s;
    }

    .upload-area:hover {
      border-color: #444;
      background: #1e1e1e;
    }

    .file-label {
      background: #2a2a2a;
      color: #eee;
      border: none;
      padding: 0.6rem 2rem;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 450;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: 0.15s;
      letter-spacing: 0.2px;
      border: 1px solid #3a3a3a;
    }

    .file-label:hover {
      background: #3a3a3a;
      border-color: #5a5a5a;
    }

    #file-input {
      display: none;
    }

    .file-status {
      color: #b0b0b0;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 140px;
    }

    #file-name {
      background: #222;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-weight: 400;
      color: #ddd;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid #333;
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.8rem;
    }

    .endpoint-box {
      background: #181818;
      border: 1px solid #2c2c2c;
      border-radius: 60px;
      padding: 0.3rem 1.2rem 0.3rem 1.8rem;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: 0.85rem;
      color: #bdbdbd;
    }

    .endpoint-box .url {
      background: #222;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
      font-weight: 450;
      color: #eaeaea;
      border: 1px solid #333;
    }

    .btn-group {
      display: flex;
      gap: 0.6rem;
    }

    .btn {
      background: #1e1e1e;
      border: 1px solid #333;
      padding: 0.5rem 1.6rem;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 450;
      color: #ddd;
      cursor: pointer;
      transition: 0.12s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: #2e2e2e;
      border-color: #4a4a4a;
      color: #f5f5f5;
    }

    .btn-primary:hover {
      background: #3d3d3d;
      border-color: #6a6a6a;
    }

    .btn-outline:hover {
      background: #282828;
      border-color: #555;
    }

    .panel {
      background: #111;
      border: 1px solid #262626;
      border-radius: 24px;
      padding: 1.2rem 1.5rem;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      color: #b0b0b0;
      font-size: 0.85rem;
      font-weight: 400;
    }

    .panel-head span i {
      margin-right: 6px;
      opacity: 0.7;
    }

    #json-output {
      background: #0a0a0a;
      color: #d4d4d4;
      padding: 1.2rem 1.5rem;
      border-radius: 18px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
      line-height: 1.65;
      max-height: 380px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid #262626;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
      transition: 0.1s;
    }

    #json-output:empty::before {
      content: "⬆  Upload an Excel file to preview JSON";
      color: #5a5a5a;
      font-style: italic;
      font-family: -apple-system, sans-serif;
    }

    .meta {
      display: flex;
      justify-content: flex-end;
      gap: 1.8rem;
      font-size: 0.7rem;
      color: #5f5f5f;
      padding-top: 0.8rem;
      border-top: 1px solid #222;
      margin-top: 0.9rem;
      letter-spacing: 0.2px;
    }

    .meta i {
      margin-right: 4px;
      opacity: 0.6;
    }

    /* scrollbar */
    #json-output::-webkit-scrollbar {
      width: 4px;
      background: #1a1a1a;
    }
    #json-output::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 10px;
    }

    @media (max-width: 650px) {
      .app { padding: 1.5rem; }
      .upload-area { border-radius: 30px; padding: 0.4rem 0.4rem 0.4rem 1.2rem; }
      .action-bar { flex-direction: column; align-items: stretch; }
      .endpoint-box { justify-content: space-between; }
      .header { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- header -->
  <div class="header">
    <div class="header-left">
      <h1>
        ⚫ Excel → JSON
        <span>API</span>
      </h1>
      <div class="sub">
        <span>upload .xlsx / .xls</span>
        <code>GET /api/data</code>
      </div>
    </div>
    <div class="badge">
      <span>●</span> live
    </div>
  </div>

  <!-- upload -->
  <div class="upload-area">
    <label for="file-input" class="file-label">
      <span>⬆</span> Choose file
    </label>
    <input type="file" id="file-input" accept=".xlsx,.xls">
    <div class="file-status">
      <span style="opacity:0.4;">📎</span>
      <span id="file-name">none</span>
    </div>
  </div>

  <!-- actions -->
  <div class="action-bar">
    <div class="endpoint-box">
      <span>🔗</span>
      <span class="url" id="api-url">/api/data</span>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="fetch-btn">⟳ Fetch</button>
      <button class="btn btn-outline" id="clear-btn">✕ Clear</button>
    </div>
  </div>

  <!-- json panel -->
  <div class="panel">
    <div class="panel-head">
      <span><i>📋</i> JSON response</span>
      <span><i>📊</i> <span id="row-count">0</span> rows</span>
    </div>
    <div id="json-output"></div>
    <div class="meta">
      <span><i>⚡</i> GET <span id="method-path">/api/data</span></span>
      <span><i>📁</i> from uploaded file</span>
    </div>
  </div>
</div>

<script>
  (function() {
    let currentData = null;
    const fileInput = document.getElementById('file-input');
    const fileName = document.getElementById('file-name');
    const jsonOut = document.getElementById('json-output');
    const rowCount = document.getElementById('row-count');
    const apiUrl = document.getElementById('api-url');
    const methodPath = document.getElementById('method-path');

    function render(data) {
      if (data && data.length) {
        jsonOut.textContent = JSON.stringify(data, null, 2);
        rowCount.textContent = data.length;
      } else {
        jsonOut.textContent = '';
        rowCount.textContent = '0';
      }
    }

    function updateFileStatus(file) {
      fileName.textContent = file ? (file.name.length > 28 ? file.name.slice(0, 25) + '…' : file.name) : 'none';
    }

    function parseExcel(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
            const first = wb.SheetNames[0];
            const json = XLSX.utils.sheet_to_json(wb.Sheets[first], { defval: '' });
            resolve(json);
          } catch (err) { reject(err); }
        };
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    async function loadFile(file) {
      if (!file) return;
      try {
        const data = await parseExcel(file);
        currentData = data;
        render(data);
        updateFileStatus(file);
        const q = file.name ? `?source=${encodeURIComponent(file.name)}` : '';
        apiUrl.textContent = '/api/data' + q;
        methodPath.textContent = '/api/data' + q;
      } catch (e) {
        jsonOut.textContent = '⚠️ ' + e.message;
        currentData = null;
        rowCount.textContent = '0';
      }
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadFile(file);
      fileInput.value = '';
    });

    document.getElementById('fetch-btn').addEventListener('click', () => {
      if (currentData && currentData.length) {
        render(currentData);
        // subtle flash
        jsonOut.style.background = '#1a1a1a';
        setTimeout(() => jsonOut.style.background = '#0a0a0a', 150);
        const file = fileInput.files[0];
        if (file) {
          const q = `?source=${encodeURIComponent(file.name)}`;
          apiUrl.textContent = '/api/data' + q;
          methodPath.textContent = '/api/data' + q;
        }
      } else {
        jsonOut.textContent = '⏳ No data loaded. Upload an Excel file first.';
        rowCount.textContent = '0';
      }
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      currentData = null;
      render(null);
      updateFileStatus(null);
      fileInput.value = '';
      apiUrl.textContent = '/api/data';
      methodPath.textContent = '/api/data';
      jsonOut.textContent = '';
      rowCount.textContent = '0';
    });

    // drag & drop
    const uploadArea = document.querySelector('.upload-area');
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = '#666'; });
    uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#2c2c2c'; });
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '#2c2c2c';
      const file = e.dataTransfer.files[0];
      if (file && (file.name.endsWith('.xlsx') || file.name.endsWith('.xls'))) {
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;
        loadFile(file);
      } else {
        jsonOut.textContent = '⚠️ Please drop an Excel file (.xlsx / .xls)';
      }
    });

    // initial
    jsonOut.textContent = '';
    rowCount.textContent = '0';
  })();
</script>
</body>
</html>
